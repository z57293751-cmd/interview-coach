<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>输入口令 · AI 面试小站</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2f6df6">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f6f8; color: #1f2329;
    }
    .box { background: #fff; border: 1px solid #e6e8eb; border-radius: 14px; padding: 28px 24px;
           width: min(92vw, 360px); box-shadow: 0 8px 30px rgba(0,0,0,.05); }
    h1 { font-size: 19px; margin: 0 0 6px; }
    p { color: #8a919c; font-size: 13px; margin: 0 0 18px; line-height: 1.6; }
    input { width: 100%; padding: 12px 14px; font-size: 16px; border: 1px solid #e6e8eb;
            border-radius: 10px; outline: none; }
    input:focus { border-color: #3b5bdb; }
    button { width: 100%; margin-top: 12px; padding: 12px; font-size: 15px; border: none;
             border-radius: 10px; background: #3b5bdb; color: #fff; cursor: pointer; }
    button:disabled { opacity: .5; }
    .err { color: #e5484d; font-size: 13px; margin-top: 10px; min-height: 18px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>AI 面试小站</h1>
    <p>这个站设了访问口令，输入后可以免密 30 天。</p>
    <input id="pwd" type="password" placeholder="请输入访问口令" autocomplete="current-password" autofocus>
    <button id="btn">进入</button>
    <div class="err" id="err"></div>
  </div>

  <script>
    var btn = document.getElementById('btn');
    var pwd = document.getElementById('pwd');
    var err = document.getElementById('err');

    async function doLogin() {
      var value = pwd.value.trim();
      if (!value) { err.textContent = '口令不能为空'; return; }
      btn.disabled = true;
      btn.textContent = '验证中…';
      err.textContent = '';
      try {
        var res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: value })
        });
        var body = null;
        try { body = await res.json(); } catch (e) { }
        if (res.ok && body && body.code === 0) {
          location.href = '/question.html';
        } else {
          err.textContent = (body && body.msg) || '验证失败，请重试';
          btn.disabled = false;
          btn.textContent = '进入';
        }
      } catch (e) {
        err.textContent = '网络错误：' + e.message;
        btn.disabled = false;
        btn.textContent = '进入';
      }
    }

    btn.addEventListener('click', doLogin);
    pwd.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') doLogin();
    });
  </script>
</body>
</html>
