<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模拟面试 · AI 面试小站</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2f6df6">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="面试小站">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin: 16px 0; }
    .card h2 { margin: 0 0 8px; font-size: 18px; }
    .muted { color: var(--dim); font-size: 13px; }
    .file-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0; }
    .file-row input[type=file] { flex: 1; min-width: 220px; font-size: 14px; }
    .progress { display: flex; justify-content: space-between; align-items: center; color: var(--dim); font-size: 13px; }
    .q-big { font-size: 19px; font-weight: 600; line-height: 1.55; margin: 10px 0 4px; }
    .why { color: var(--dim); font-size: 12px; margin-bottom: 14px; }
    textarea { width: 100%; min-height: 150px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; font-family: inherit; line-height: 1.6; resize: vertical; }
    .btn-row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px; }
    .result-box { background: #fbfbfd; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-top: 16px; }
    .score-line { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
    .score-big { font-size: 30px; font-weight: 700; color: var(--brand); }
    .missed { margin: 8px 0 0; padding-left: 18px; color: #b02a2e; font-size: 13.5px; }
    .followup { margin-top: 10px; padding: 10px 12px; background: #eef1ff; border-radius: 8px; font-size: 14px; }
    .report-item { border-top: 1px solid var(--line); padding: 12px 0; }
    .report-item:first-of-type { border-top: none; }
    .small { font-size: 12px; color: var(--dim); }
    .hidden { display: none !important; }
    .spin { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body data-page="mock">
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="question.html">AI 面试小站</a>
      <nav>
        <a href="question.html">题库</a>
        <a href="mock.html" class="active">模拟面试</a>
        <a href="review.html">复盘</a>
      </nav>
    </div>
  </header>

  <main class="container narrow">

    <!-- ① 上传简历 -->
    <section id="uploadView">
      <div class="card">
        <h2>上传简历，开始一场真实模拟面试</h2>
        <p class="muted">AI 会先读懂你的简历，再出 10 道针对你的题（项目 3 / Java 基础 3 / 数据库 2 / 框架 2），
          一题一题问，答完给分并追问。不联网、不上传第三方。</p>
        <div class="file-row">
          <input type="file" id="fileInput" accept=".pdf,.txt,.md">
          <button id="uploadBtn">上传并分析</button>
        </div>
        <div id="uploadHint" class="muted"></div>
      </div>
    </section>

    <!-- ② 简历就绪 -->
    <section id="readyView" class="hidden">
      <div class="card">
        <h2>简历已解析</h2>
        <p id="summaryText" style="font-size:15px;margin:6px 0 12px;"></p>
        <div id="techChips" class="chips"></div>
        <div id="projectList" class="muted" style="margin-top:10px;"></div>
        <div class="btn-row">
          <button class="ghost" id="reuploadBtn">换一份简历</button>
          <button id="startBtn">开始模拟面试（10 题）</button>
        </div>
      </div>
    </section>

    <!-- ③ 面试中 -->
    <section id="interviewView" class="hidden">
      <div class="card">
        <div class="progress">
          <span>第 <b id="seq">1</b> / <span id="total">10</span> 题</span>
          <span id="catBadge" class="badge"></span>
        </div>
        <div class="q-big" id="questionText"></div>
        <div class="why" id="whyText"></div>
        <textarea id="answerInput" placeholder="像面试时那样口头回答，写下来就行。答不上来也照实写，AI 会告诉你差在哪。"></textarea>
        <div class="btn-row">
          <button id="submitBtn">提交回答</button>
        </div>
      </div>

      <div id="resultBox" class="result-box hidden">
        <div class="score-line">
          <span class="score-big" id="scoreText">0</span>
          <span class="muted">分</span>
        </div>
        <div id="commentText" style="font-size:14px;"></div>
        <div id="missedBox"></div>
        <div id="followupBox" class="followup hidden"></div>
        <div class="btn-row">
          <button id="nextBtn">下一题 →</button>
        </div>
      </div>
    </section>

    <!-- ④ 面试报告 -->
    <section id="reportView" class="hidden">
      <div class="card">
        <h2>面试结束</h2>
        <div class="score-line">
          <span class="score-big" id="totalScore">0</span>
          <span class="muted">总分 / 100</span>
        </div>
        <div id="catScores" class="chips"></div>
        <div id="reportList" style="margin-top:16px;"></div>
        <div class="btn-row">
          <button class="ghost" id="againBtn">再来一场</button>
        </div>
      </div>
    </section>

  </main>

  <script>
    'use strict';

    var state = { resumeId: null, sessionId: null, total: 0, seq: 1 };

    function $(id) { return document.getElementById(id); }

    function esc(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    async function req(path, options) {
      var res = await fetch(path, options || {});
      var body = null;
      try { body = await res.json(); } catch (e) { }
      if (res.status === 401) {
        location.href = '/login.html';
        throw new Error('需要访问口令');
      }
      if (!res.ok || !body || body.code !== 0) {
        throw new Error((body && body.msg) || ('请求失败 HTTP ' + res.status));
      }
      return body.data;
    }

    function show(which) {
      ['uploadView', 'readyView', 'interviewView', 'reportView'].forEach(function (id) {
        $(id).classList.toggle('hidden', id !== which);
      });
    }

    function busy(btn, text) {
      btn.dataset.old = btn.textContent;
      btn.textContent = text;
      btn.disabled = true;
    }
    function idle(btn) {
      btn.textContent = btn.dataset.old || btn.textContent;
      btn.disabled = false;
    }

    /* ---------- 上传 ---------- */
    $('uploadBtn').addEventListener('click', async function () {
      var file = $('fileInput').files[0];
      if (!file) { $('uploadHint').textContent = '先选一个 PDF 或 TXT 文件'; return; }
      var btn = this;
      busy(btn, 'AI 正在读简历…');
      $('uploadHint').textContent = '解析 + 提炼要点，大约 10-20 秒';
      try {
        var fd = new FormData();
        fd.append('file', file);
        var data = await req('/api/resumes', { method: 'POST', body: fd });
        var profile = {};
        try { profile = JSON.parse(data.profile || '{}'); } catch (e) { }

        state.resumeId = data.resumeId;
        $('summaryText').textContent = data.summary || (profile.summary || '（AI 没给出一句话概括）');

        var chips = (profile.techStack || []).map(function (t) {
          return '<span class="chip">' + esc(t) + '</span>';
        }).join('');
        $('techChips').innerHTML = chips || '<span class="muted">没识别出技术栈</span>';

        var projects = (profile.projects || []).map(function (p) {
          return '<div>· ' + esc(p.name || '') + '：' + esc(p.role || '') + '</div>';
        }).join('');
        $('projectList').innerHTML = projects ? '<div class="small">识别到的项目</div>' + projects : '';

        $('uploadHint').textContent = '';
        show('readyView');
      } catch (e) {
        $('uploadHint').textContent = '出错了：' + e.message;
        show('uploadView');
      } finally {
        idle(btn);
      }
    });

    $('reuploadBtn').addEventListener('click', function () {
      show('uploadView');
      $('fileInput').value = '';
      $('uploadHint').textContent = '';
    });

    $('againBtn').addEventListener('click', function () {
      show('uploadView');
      $('fileInput').value = '';
      $('uploadHint').textContent = '';
    });

    /* ---------- 开始面试 ---------- */
    function renderTurn(turn) {
      $('seq').textContent = turn.seq;
      $('catBadge').textContent = turn.category || '';
      $('questionText').textContent = turn.question || '';
      $('whyText').textContent = turn.why ? ('出题意图：' + turn.why) : '';
      $('answerInput').value = '';
      $('resultBox').classList.add('hidden');
      $('answerInput').disabled = false;
      $('submitBtn').classList.remove('hidden');
    }

    $('startBtn').addEventListener('click', async function () {
      var btn = this;
      busy(btn, '面试官准备中…');
      try {
        var data = await req('/api/mock/sessions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ resumeId: state.resumeId })
        });
        state.sessionId = data.sessionId;
        state.total = data.total;
        state.seq = 1;
        $('total').textContent = data.total;
        renderTurn(data.turn);
        show('interviewView');
      } catch (e) {
        alert('出题失败：' + e.message);
      } finally {
        idle(btn);
      }
    });

    /* ---------- 提交回答 ---------- */
    $('submitBtn').addEventListener('click', async function () {
      var answer = $('answerInput').value.trim();
      if (answer.length < 5) { alert('回答太短了'); return; }
      var btn = this;
      busy(btn, '面试官评分中…');
      $('answerInput').disabled = true;
      try {
        var data = await req('/api/mock/sessions/' + state.sessionId + '/answer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ answer: answer })
        });

        var r = data.result;
        $('scoreText').textContent = r.score;
        $('commentText').textContent = r.comment || '';

        var missed = [];
        try { missed = JSON.parse(r.missedPoints || '[]'); } catch (e) { }
        $('missedBox').innerHTML = missed.length
          ? '<ul class="missed">' + missed.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join('') + '</ul>'
          : '';

        if (r.followup) {
          $('followupBox').classList.remove('hidden');
          $('followupBox').innerHTML = '<b>面试官追问：</b>' + esc(r.followup);
        } else {
          $('followupBox').classList.add('hidden');
        }

        $('resultBox').classList.remove('hidden');
        $('submitBtn').classList.add('hidden');

        if (data.finished) {
          $('nextBtn').textContent = '查看面试报告 →';
          $('nextBtn').dataset.finish = '1';
        } else {
          $('nextBtn').textContent = '下一题 →';
          delete $('nextBtn').dataset.finish;
          $('nextBtn').dataset.next = JSON.stringify(data.turn);
        }
      } catch (e) {
        alert('评分失败：' + e.message);
        $('answerInput').disabled = false;
      } finally {
        idle(btn);
      }
    });

    /* ---------- 下一题 / 报告 ---------- */
    $('nextBtn').addEventListener('click', async function () {
      var btn = this;
      if (btn.dataset.finish === '1') {
        var data = await req('/api/mock/sessions/' + state.sessionId);
        renderReport(data);
        return;
      }
      var next = JSON.parse(btn.dataset.next);
      renderTurn(next);
      btn.dataset.finish = '';
      $('answerInput').focus();
    });

    function renderReport(data) {
      $('totalScore').textContent = data.totalScore === null ? '-' : data.totalScore;

      var catHtml = Object.keys(data.categoryScores || {}).map(function (k) {
        return '<span class="chip">' + esc(k) + '：' + data.categoryScores[k] + ' 分</span>';
      }).join('');
      $('catScores').innerHTML = catHtml;

      var items = (data.turns || []).map(function (t) {
        return '<div class="report-item">'
          + '<div class="small">第 ' + t.seq + ' 题 · ' + esc(t.category || '') + '</div>'
          + '<div style="font-weight:600;margin:2px 0 4px;">' + esc(t.question) + '</div>'
          + '<div class="small">得分：' + (t.score === null ? '未作答' : t.score) + '　' + esc(t.comment || '') + '</div>'
          + '</div>';
      }).join('');
      $('reportList').innerHTML = items;
      show('reportView');
    }
  </script>
</body>
</html>
